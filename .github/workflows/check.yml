# Runs the same gate as the local recipe documented in AGENTS.md:
# `npm run check` (docs, typecheck, tests, build). A local pass must be a CI pass,
# so this workflow adds no other check commands.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the minimum major in package.json engines.node; 26 exercises the
        # current line. A green check certifies the supported range endpoints.
        node-version: [24, 26]
    name: check (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
