# Runs the same gate as the local recipe documented in AGENTS.md:
# `npm run check` (dependency audit at high severity, docs, deploy units,
# typecheck, tests with line/branch/function coverage floors, build). A local
# pass must be a CI pass, so this workflow adds no other check commands. It
# also runs nightly (core
# ADR-0021's compliance run) so drift that arrives from outside the repository
# — an npm advisory, a Node point release, a stale action pin, a transitive
# that resolves differently — turns the check red within a day rather than on
# the next pull request; `workflow_dispatch` allows a manual re-run. The same
# two checks also run on a merge-queue branch (core ADR-0042): a required check
# that never reports there stalls every queue entry, so the trigger stays here
# and no job excludes itself with an event-level `if`.
#
# Node comes from mise.toml/mise.lock (core ADR-0043, Snowcat ADR-0076), the
# single place the version is pinned; this workflow states no version of its
# own. The prior 24/26 matrix is dropped rather than kept as a second source
# of truth: mise.lock's checksums cover only the pinned 24 line, so exercising
# 26 here would mean either a second pin (defeating "one place") or an
# unverified override (defeating the checksum guarantee ADR-0043 exists for).
name: check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * *" # nightly, 06:17 UTC
  workflow_dispatch:

# Least privilege (core ADR-0021): nothing at the workflow level, and the one
# job reads the repository only. Actions are pinned to full commit SHAs with
# the release tag as a comment.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    name: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - run: npm ci
      - run: npm run check
