# Runs the same gate as the local recipe documented in AGENTS.md:
# `npm run check` (docs, deploy units, typecheck, tests, build). A local pass must be a CI pass,
# so this workflow adds no other check commands. It also runs nightly (core
# ADR-0021's compliance run) so drift that arrives from outside the repository
# — an npm advisory, a Node point release, a stale action pin, a transitive
# that resolves differently — turns the check red within a day rather than on
# the next pull request; `workflow_dispatch` allows a manual re-run.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # nightly, 06:17 UTC
  workflow_dispatch:

# Least privilege (core ADR-0021): nothing at the workflow level, and the one
# job reads the repository only. Actions are pinned to full commit SHAs with
# the release tag as a comment.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 24 is the minimum major in package.json engines.node; 26 exercises the
        # current line. A green check certifies the supported range endpoints.
        node-version: [24, 26]
    name: check (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
